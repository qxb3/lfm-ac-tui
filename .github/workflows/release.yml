name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build binaries
# and publish them as a GitHub release. workflow_dispatch only builds the
# artifacts, which is handy for testing the workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Maintainer shown in the generated .deb/.rpm packages.
  PACKAGE_MAINTAINER: "qxb3 <qxb3@users.noreply.github.com>"

jobs:
  linux:
    name: linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Each leg builds natively (x86_64 on x86_64, aarch64 on arm), so the
    # musl-gcc wrapper from musl-tools is a compiler for the right target.
    # Without it the C parts of the dependency tree (ring, zstd, ...) cannot
    # find a C compiler and fail with
    # "failed to find tool \"aarch64-linux-musl-gcc\"".
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      AR_x86_64_unknown_linux_musl: ar
      CC_aarch64_unknown_linux_musl: musl-gcc
      AR_aarch64_unknown_linux_musl: ar
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static binaries (musl, static-pie) that run on any Linux
          # distribution, old or new, glibc or musl. This is the one that
          # matters for Steam Deck and other immutable distros, where a
          # CachyOS/Arch/Ubuntu build would be the wrong libc or version.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rpm
          musl-gcc --version | head -n1

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          # \r\? keeps a CRLF checkout (Windows editors, autocrlf) from
          # corrupting the version string.
          version=$(sed -n 's/^version = "\(.*\)"\r\?$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi

          # A release tag must agree with the crate version, otherwise assets
          # would be mislabelled.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag $tag does not match Cargo.toml version $version" >&2
              exit 1
            fi
          fi

          name="lfm-ac-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lfm-ac" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - name: Build distro packages
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"\r\?$/\1/p' Cargo.toml | head -n1)
          bin="target/${{ matrix.target }}/release/lfm-ac"
          homepage="https://github.com/${{ github.repository }}"
          mkdir -p dist

          # The binary is self-contained: no runtime dependencies, so the
          # packages are just a wrapper around it.
          summary="Terminal client for Low Fuel Motorsport and Assetto Corsa"

          # .deb — Debian, Ubuntu, Mint, Pop!_OS, Kali, SteamOS, ...
          deb_arch=$(dpkg --print-architecture)
          deb_root="pkg/deb/${deb_arch}"
          rm -rf "$deb_root"
          install -Dm755 "$bin" "$deb_root/usr/bin/lfm-ac"
          install -Dm644 README.md "$deb_root/usr/share/doc/lfm-ac/README.md"
          install -Dm644 LICENSE "$deb_root/usr/share/doc/lfm-ac/copyright"
          mkdir -p "$deb_root/DEBIAN"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: lfm-ac
          Version: $version
          Architecture: $deb_arch
          Maintainer: $PACKAGE_MAINTAINER
          Section: games
          Priority: optional
          Homepage: $homepage
          Description: $summary
           Syncs the Assetto Corsa mods a Low Fuel Motorsport season requires,
           lists practice servers and upcoming races, and signs up for races
           from the terminal.
          EOF
          dpkg-deb --build --root-owner-group "$deb_root" \
            "dist/lfm-ac_${version}_${deb_arch}.deb"

          # .rpm — Fedora, RHEL, Rocky, Alma, CentOS Stream, openSUSE, Amazon Linux
          topdir="$PWD/pkg/rpm"
          rm -rf "$topdir"
          mkdir -p "$topdir"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "$bin" "$topdir/SOURCES/lfm-ac"
          cp README.md "$topdir/SOURCES/README.md"
          cp LICENSE "$topdir/SOURCES/LICENSE"
          cat > "$topdir/SPECS/lfm-ac.spec" <<EOF
          %define debug_package %{nil}
          Name: lfm-ac
          Version: $version
          Release: 1
          Summary: $summary
          License: MIT
          URL: $homepage
          %description
          Syncs the Assetto Corsa mods a Low Fuel Motorsport season requires,
          lists practice servers and upcoming races, and signs up for races
          from the terminal.
          %install
          install -Dm755 %{_sourcedir}/lfm-ac %{buildroot}%{_bindir}/lfm-ac
          install -Dm644 %{_sourcedir}/README.md %{buildroot}%{_docdir}/%{name}/README.md
          install -Dm644 %{_sourcedir}/LICENSE %{buildroot}%{_licensedir}/%{name}/LICENSE
          %files
          %{_bindir}/lfm-ac
          %{_docdir}/%{name}/README.md
          %license %{_licensedir}/%{name}/LICENSE
          EOF
          rpmbuild -bb --define "_topdir $topdir" "$topdir/SPECS/lfm-ac.spec"
          cp "$topdir"/RPMS/*/*.rpm dist/

          (cd dist && sha256sum lfm-ac_*.deb lfm-ac-*.rpm \
            > "packages-${{ matrix.target }}.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: lfm-ac-linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows x86_64-pc-windows-msvc
    runs-on: windows-2022
    # The runner ships Git Bash and the MSVC toolchain; bash keeps this job's
    # steps identical in shape to the Linux ones.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"\r\?$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag $tag does not match Cargo.toml version $version" >&2
              exit 1
            fi
          fi

          # Windows is where Assetto Corsa and the LFM app live, so this is the
          # asset most users will download. The zip keeps a top-level folder so
          # extracting it cannot scatter files over Downloads.
          name="lfm-ac-${version}-x86_64-pc-windows-msvc"
          rm -rf "stage/$name"
          mkdir -p "stage/$name" dist
          cp "target/x86_64-pc-windows-msvc/release/lfm-ac.exe" \
            README.md LICENSE "stage/$name/"
          powershell -NoProfile -Command \
            "Compress-Archive -Path 'stage/$name' -DestinationPath 'dist/$name.zip' -Force"
          rm -rf "stage/$name"
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: lfm-ac-windows-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256
          ls -l

      - name: Generate Arch Linux PKGBUILD
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${{ github.repository }}/releases/download/v${version}"
          tar_x86="lfm-ac-${version}-x86_64-unknown-linux-musl.tar.gz"
          tar_arm="lfm-ac-${version}-aarch64-unknown-linux-musl.tar.gz"
          sum_x86=$(sha256sum "dist/$tar_x86" | cut -d' ' -f1)
          sum_arm=$(sha256sum "dist/$tar_arm" | cut -d' ' -f1)

          # A binary PKGBUILD: no compiling, just the released static tarball.
          # `\$` keeps makepkg's own variables out of shell expansion.
          cat > dist/PKGBUILD <<EOF
          # Maintainer: $PACKAGE_MAINTAINER
          pkgname=lfm-ac-bin
          pkgver=${version}
          pkgrel=1
          pkgdesc="Terminal client for Low Fuel Motorsport and Assetto Corsa"
          arch=('x86_64' 'aarch64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          provides=('lfm-ac')
          conflicts=('lfm-ac')
          options=(!strip !debug)
          source_x86_64=("${tar_x86}::${base}/${tar_x86}")
          sha256sums_x86_64=('${sum_x86}')
          source_aarch64=("${tar_arm}::${base}/${tar_arm}")
          sha256sums_aarch64=('${sum_arm}')

          package() {
            local dir="\$srcdir/lfm-ac-\$pkgver-\${CARCH}-unknown-linux-musl"
            install -Dm755 "\$dir/lfm-ac" "\$pkgdir/usr/bin/lfm-ac"
            install -Dm644 "\$dir/README.md" \
              "\$pkgdir/usr/share/doc/lfm-ac/README.md"
            install -Dm644 "\$dir/LICENSE" \
              "\$pkgdir/usr/share/licenses/lfm-ac/LICENSE"
          }
          EOF
          bash -n dist/PKGBUILD
          cat dist/PKGBUILD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The release carries no description text: just a title and assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" \
              -f body="" >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="$GITHUB_REF_NAME" \
              -f body="" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
